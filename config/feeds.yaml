# Default: only articles from the last 36 hours count as new.
max_age_hours: 36

# Skip articles whose title or link matches any of these (regex, case-insensitive).
exclude_title:
  - "^Watch:"
  - "in 100 Sekunden"
exclude_link:
  - "/videos?/"
  - "/wetter/"

# Add or remove sources here. category is free text.
# A source can override the time window with its own max_age_hours.
feeds:
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    category: world
  - name: Tagesschau
    url: https://www.tagesschau.de/index~rss2.xml
    category: germany
  - name: The Hindu - National
    url: https://www.thehindu.com/news/national/feeder/default.rss
    category: india
  - name: NVIDIA Technical Blog
    url: https://developer.nvidia.com/blog/feed
    category: tech
    max_age_hours: 168
  - name: arXiv cs.DC (parallel computing)
    url: https://rss.arxiv.org/rss/cs.DC
    category: research

  # ---- Jobs: Bundesagentur für Arbeit job search (public API) ----
  # angebotsart 34 = internship/trainee. Leave it out for normal jobs.
  - name: Arbeitsagentur Jobs
    type: arbeitsagentur
    category: jobs
    days: 7               # only jobs published in the last 7 days
    max_age_hours: 192
    searches:
      - {was: "HPC"}
      - {was: "High Performance Computing"}
      - {was: "Simulation", angebotsart: 34}
      - {was: "Werkstudent Simulation"}
      - {was: "CFD"}
      - {was: "CUDA"}
      - {was: "Quantencomputing"}
      - {was: "Masterarbeit Simulation"}
